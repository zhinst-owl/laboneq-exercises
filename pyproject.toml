[project]
name = "laboneq-exercises"
version = "0.1.0"
description = "LabOne Q exercises at different levels of difficulty"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "laboneq==26.10.1",
    "laboneq_applications==26.10.1",
    "matplotlib",
    "jupyterlab",
    "ipykernel",
]

[project.optional-dependencies]
test = [
    "pytest",
    "nbclient",
    "nbformat",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
