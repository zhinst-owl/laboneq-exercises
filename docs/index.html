<style>

    --line: #d9dee6; --accent: #0a6ebd; --accent-text: #ffffff; --chip: #eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181e; --card: #1d232c; --text: #e6eaf0; --muted: #9aa5b5;
      --line: #313a47; --accent: #4aa8ee; --accent-text: #0b1118; --chip: #283140;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 960px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 1.7rem; }
  p.lead { margin: 0 0 24px; color: var(--muted); }
  a { color: var(--accent); }
  fieldset { border: 0; padding: 0; margin: 0 0 14px; }
  legend { padding: 0; margin-bottom: 6px; font-size: 0.8rem; font-weight: 600;
           text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  button.chip {
    font: inherit; font-size: 0.9rem; padding: 4px 12px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
  }
  button.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.chip:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin: 22px 0 12px; color: var(--muted); }
  button.reset { font: inherit; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  article { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; }
  article h2 { margin: 0 0 8px; font-size: 1.05rem; }

  .meta { font-size: 0.85rem; color: var(--muted); margin-bottom: 10px; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px; }

<body>
<main>
  <h1>LabOne Q exercises</h1>
  <p class="lead">Pick a level, a type and one or more topics, or do them in order: they are sorted from the easiest to the hardest. All exercises run in emulation.
    <a id="repo">Repository and install instructions</a></p>

  <fieldset><legend>Level</legend><div class="chips" id="level"></div></fieldset>
  <fieldset><legend>Type</legend><div class="chips" id="type"></div></fieldset>
  <fieldset><legend>Topics (any of)</legend><div class="chips" id="topics"></div></fieldset>

  <div class="bar"><span id="count" aria-live="polite"></span><button class="reset" id="reset">Clear filters</button></div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>No exercise matches these filters.</p>
</main>

<script>
const DATA = {
 "repository": "https://github.com/zhinst-owl/laboneq-exercises",
 "levels": [
  "basic",
  "medium",
  "advanced",
  "expert"
 ],
 "types": [
  "write-the-code",
  "fix-the-bugs",
  "quiz"
 ],
 "topics": [
  "calibration",
  "chunking",
  "device-setup",
  "dsl",
  "Gen2",
  "output-router",
  "pulses",
  "readout",
  "sections",
  "SHFQA",
  "SHFSG",
  "sweeps",
  "timing"
 ],
 "exercises": [
  {
   "id": "004",
   "title": "Chirp pulse sweep",
   "level": "basic",
   "type": "write-the-code",
   "topics": [
    "Gen2",
    "dsl",
    "pulses",
    "sweeps",
    "chunking"
   ],
   "exercise_url": "https://github.com/zhinst-owl/laboneq-exercises/blob/main/exercises/004_chirp_pulse_sweep/exercise.ipynb",
   "solution_url": "https://github.com/zhinst-owl/laboneq-exercises/blob/main/exercises/004_chirp_pulse_sweep/solution.ipynb"
  },
  {
   "id": "001",
   "title": "Hahn echo timing",
   "level": "medium",
   "type": "fix-the-bugs",
   "topics": [
    "dsl",
    "sections",
    "timing",
    "Gen2"
   ],
   "exercise_url": "https://github.com/zhinst-owl/laboneq-exercises/blob/main/exercises/001_hahn_echo_timing/exercise.ipynb",
   "solution_url": "https://github.com/zhinst-owl/laboneq-exercises/blob/main/exercises/001_hahn_echo_timing/solution.ipynb"
  },
  {
   "id": "003",
   "title": "Readout amplitude sweep",
   "level": "medium",
   "type": "fix-the-bugs",
   "topics": [
    "Gen2",
    "SHFQA",
    "readout",
    "sweeps",
    "chunking"
   ],
   "exercise_url": "https://github.com/zhinst-owl/laboneq-exercises/blob/main/exercises/003_readout_amplitude_sweep/exercise.ipynb",
   "solution_url": "https://github.com/zhinst-owl/laboneq-exercises/blob/main/exercises/003_readout_amplitude_sweep/solution.ipynb"
  },
  {
   "id": "002",
   "title": "Four frequencies on one output",
   "level": "advanced",
   "type": "fix-the-bugs",
   "topics": [
    "Gen2",
    "SHFSG",
    "output-router",
    "calibration",
    "device-setup"
   ],
   "exercise_url": "https://github.com/zhinst-owl/laboneq-exercises/blob/main/exercises/002_output_router/exercise.ipynb",
   "solution_url": "https://github.com/zhinst-owl/laboneq-exercises/blob/main/exercises/002_output_router/solution.ipynb"
  }
 ]
};

const selected = { level: new Set(), type: new Set(), topics: new Set() };

function makeChips(group, values) {
  const box = document.getElementById(group);
  for (const value of values) {
    const button = document.createElement("button");
    button.className = "chip";
    button.textContent = value;
    button.setAttribute("aria-pressed", "false");
    button.addEventListener("click", () => {
      if (selected[group].has(value)) selected[group].delete(value);
      else selected[group].add(value);
      button.setAttribute("aria-pressed", String(selected[group].has(value)));
      render();
    });
    box.appendChild(button);
  }
}

function matches(exercise) {
  if (selected.level.size && !selected.level.has(exercise.level)) return false;
  if (selected.type.size && !selected.type.has(exercise.type)) return false;
  if (selected.topics.size && !exercise.topics.some((topic) => selected.topics.has(topic))) return false;
  return true;
}

function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text) node.textContent = text;
  if (className) node.className = className;
  return node;
}

function link(text, url) {
  const a = element("a", text);
  a.href = url;
  return a;
}

function render() {
  const grid = document.getElementById("grid");
  grid.replaceChildren();
  const shown = DATA.exercises.filter(matches);
  for (const exercise of shown) {
    const card = element("article");
    const title = element("h2");
    title.append(element("span", exercise.id), exercise.title);
    const tags = element("div", "", "tags");
    for (const topic of exercise.topics) tags.append(element("span", topic));
    const links = element("div", "", "links");
    links.append(link("Exercise", exercise.exercise_url), link("Solution", exercise.solution_url));
    card.append(title, element("div", exercise.level + " · " + exercise.type, "meta"), tags, links);
    grid.append(card);
  }
  document.getElementById("count").textContent = shown.length + " of " + DATA.exercises.length + " exercises";
  document.getElementById("empty").hidden = shown.length > 0;
}

document.getElementById("repo").href = DATA.repository;
document.getElementById("reset").addEventListener("click", () => {
  for (const group of Object.values(selected)) group.clear();
  for (const button of document.querySelectorAll("button.chip")) button.setAttribute("aria-pressed", "false");
  render();
});

makeChips("level", DATA.levels);
makeChips("type", DATA.types);
makeChips("topics", DATA.topics);
render();
</script>
</body>
</html>
